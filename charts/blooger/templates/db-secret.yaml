{{- if and .Values.db.enabled (not .Values.db.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" (include "blooger.db.name" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blooger.db.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    {{- include "blooger.labels" . | nindent 4 }}
type: Opaque
stringData:
  # These three keys are consumed by the postgres image (envFrom) and by the
  # backend (secretKeyRef). Single source of truth — the probes read them from
  # the container environment rather than hardcoding a username, so they can
  # never drift out of sync with what the database was actually initialised as.
  POSTGRES_USER: {{ .Values.db.auth.username | quote }}
  POSTGRES_PASSWORD: {{ include "blooger.db.password" . | quote }}
  POSTGRES_DB: {{ .Values.db.auth.database | quote }}
{{- end }}
