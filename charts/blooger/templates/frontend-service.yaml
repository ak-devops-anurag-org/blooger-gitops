apiVersion: v1
kind: Service
metadata:
  name: {{ include "blooger.frontend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blooger.frontend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    {{- include "blooger.labels" . | nindent 4 }}
spec:
  # NodePort by default — reachable on every node IP, and it provisions nothing
  # in your cloud account. Switch to LoadBalancer only if you want to pay for
  # one: --set frontend.service.type=LoadBalancer
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "blooger.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.frontend.service.nodePort (ne (toString .Values.frontend.service.type) "ClusterIP") }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
