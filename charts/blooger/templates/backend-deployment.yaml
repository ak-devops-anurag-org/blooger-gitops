apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blooger.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blooger.backend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- include "blooger.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "blooger.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blooger.backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- include "blooger.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $ownSecret := and .Values.db.enabled (not .Values.db.auth.existingSecret) }}
      {{- if or $ownSecret .Values.podAnnotations }}
      annotations:
        {{- if $ownSecret }}
        # Rolls the backend automatically if the DB credentials change.
        checksum/db-secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.backend.waitForDb.enabled .Values.db.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ include "blooger.image" .Values.backend.waitForDb.image }}
          imagePullPolicy: {{ .Values.backend.waitForDb.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ include "blooger.db.name" . }}:{{ .Values.db.service.port }} ..."
              until nc -z {{ include "blooger.db.name" . }} {{ .Values.db.service.port }}; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          # image: {{ include "blooger.image" .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.backend.containerPort | quote }}
            - name: DB_HOST
              value: {{ include "blooger.db.name" . | quote }}
            - name: DB_PORT
              value: {{ .Values.db.service.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "blooger.db.secretName" . }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blooger.db.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "blooger.db.secretName" . }}
                  key: POSTGRES_DB
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
