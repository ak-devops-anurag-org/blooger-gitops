apiVersion: v1
kind: Service
metadata:
  name: {{ include "blooger.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blooger.backend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- include "blooger.labels" . | nindent 4 }}
spec:
  # ClusterIP. The frontend's nginx proxies to this name in-cluster; the API is
  # not exposed directly to the outside world.
  type: ClusterIP
  selector:
    {{- include "blooger.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
